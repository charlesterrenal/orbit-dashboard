name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - name: Build (no .env files, example services config)
        run: |
          mkdir -p public/config && cp config/services.example.json public/config/services.json
          npm run build

      - name: No credential-like strings in the bundle
        run: grep -rlE 'PVEAPIToken|tskey-|X-Api-Key|apikey=' dist && exit 1 || true

      - name: Gateway policy tests
        run: bash scripts/test-gateway.sh
