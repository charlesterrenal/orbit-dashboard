name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-gateway:
    runs-on: ubuntu-latest
    env:
      # puppeteer is only for docs screenshots; skip its Chromium download.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint (src only; root app.js is a stray portfolio bundle)
        run: npx oxlint src

      - name: Build (no .env files, example services config)
        run: |
          cp src/config/services.example.json src/config/services.json
          npm run build

      - name: No credential-like strings in the bundle
        run: |
          if grep -rlP 'PVEAPIToken=(?!undefined|\$\{)[A-Za-z0-9@]|tskey-[a-z]+-[A-Za-z0-9]{10,}' dist; then
            echo "::error::credential-like string found in dist/"
            exit 1
          fi

      - name: Gateway policy tests
        run: bash scripts/test-gateway.sh
